<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="沿着地形图探索史前天地的九处展区，走进溪谷、巨木林与浅海。">
  <title>史前天地</title>
  <link rel="stylesheet" href="./island/style.css">
</head>
<body>
  <header class="site-header shell">
    <span class="wordmark" aria-current="page">史前天地</span>
    <nav aria-label="主导航">
      <a href="./island/">岛屿地图</a>
    </nav>
  </header>

  <main class="home shell">
    <div class="hero-copy">
      <h1>走进<span>史前天地</span></h1>
      <p class="hero-intro">从溪谷的细泉走到海边，穿过巨木林和开阔草甸，寻找生活在不同年代的史前动物。</p>
      <div class="hero-actions">
        <a class="action" href="./island/">打开岛屿地图 <span aria-hidden="true">↗</span></a>
        <a class="text-link" href="./creek/?place=sample-source">从溪谷出发 <span aria-hidden="true">→</span></a>
      </div>
      <p class="scientific-note">这是一座为游览设计的想象岛屿。展区借鉴不同地貌和生境，动物来自不同年代、不同地区。</p>
    </div>
    <figure class="hero-map">
      <div class="map-surface">
        <img src="./island/assets/terrain.webp" width="512" height="512" fetchpriority="high" alt="整岛地形图，北侧为高地，西侧为溪谷和岩湾，东侧为草甸和浅海，南侧为湿地。">
        <span class="compass" aria-hidden="true">↑<small>北</small></span>
        <span class="map-scale" aria-hidden="true">4 km</span>
      </div>
      <figcaption>全岛地形 <span>9 处展区</span></figcaption>
    </figure>
  </main>

  <footer class="site-footer shell">
    <p>史前动物博物馆</p>
    <p>三维漫游需要支持 WebGPU 的桌面浏览器</p>
  </footer>
</body>
</html>
