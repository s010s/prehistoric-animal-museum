<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="史前天地的全岛地形图。选择九处展区之一，查看史前动物及可漫游的观察点。">
  <title>岛屿地图 · 史前天地</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header shell">
    <a class="wordmark" href="../">史前天地</a>
    <nav aria-label="主导航">
      <span aria-current="page">岛屿地图</span>
      <a href="../creek/?place=sample-source">从溪谷出发 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main class="shell">
    <header class="atlas-header">
      <h1>岛屿地图</h1>
      <p>选一处展区，看有哪些动物，再从观察点进入岛上。</p>
    </header>

    <section class="atlas" aria-label="全岛导览">
      <div class="map-column">
        <figure class="map">
          <div class="map-toolbar">
            <h2>全岛地形</h2>
            <div class="layers" role="group" aria-label="地图图层">
              <button type="button" data-layer="terrain" aria-pressed="true">地形</button>
              <button type="button" data-layer="habitat" aria-pressed="false">生态</button>
            </div>
          </div>
          <div class="map-surface">
            <img id="terrain" src="./assets/terrain.webp" width="512" height="512" fetchpriority="high" alt="鸟瞰全岛地形，北方朝上。数字对应展区，菱形标记动物展位，圆点标记河口。">
            <img id="habitat" width="512" height="512" alt="鸟瞰全岛生态，北方朝上。数字对应展区，菱形标记动物展位，圆点标记河口。" hidden>
            <svg id="map-overlay" viewBox="0 0 512 512" aria-hidden="true"></svg>
            <div id="markers" role="group" aria-label="地图上的展区"></div>
            <span class="compass" aria-hidden="true">↑<small>北</small></span>
            <span class="map-scale" aria-hidden="true">4 km</span>
          </div>
          <figcaption class="map-caption">
            <span><i class="map-key-region" aria-hidden="true"></i>展区</span>
            <span><i class="map-key-fauna" aria-hidden="true"></i>所选展区的动物展位</span>
            <span class="map-habitat-key" hidden>深绿 林地 · 褐黄 开阔地 · 青绿 水际</span>
            <a class="map-overview-link" href="../creek/?place=island-overview">从空中看全岛 <span aria-hidden="true">↗</span></a>
          </figcaption>
        </figure>
        <nav class="mouth-visits" aria-label="河口观察点">
          <a href="../creek/?place=sample-mouth" data-mouth="sample-mouth">西岸样板河口 <span aria-hidden="true">↗</span></a>
          <a href="../creek/?place=estuary" data-mouth="estuary">南部主河口岸边 <span aria-hidden="true">↗</span></a>
          <a href="../creek/?place=main-estuary-overlook" data-mouth="estuary">南部主河口俯瞰 <span aria-hidden="true">↗</span></a>
        </nav>
        <p id="map-status" class="map-status" role="status"></p>
        <noscript><p class="map-status">启用 JavaScript 可切换图层和查看观察点。</p></noscript>
      </div>

      <div class="atlas-sidebar">
        <nav id="region-list" class="region-list" aria-label="按展区浏览"></nav>
        <article id="region-detail" class="region-detail" hidden>
          <h2 id="region-name" tabindex="-1"></h2>
          <p id="region-landform" class="region-description"></p>
          <p id="region-note" class="region-science" hidden></p>
          <section aria-labelledby="animal-title">
            <h3 id="animal-title">动物展位</h3>
            <div id="region-fauna"></div>
            <p id="no-fauna" class="region-science" hidden>这里可以先从地貌观察点开始游览。</p>
          </section>
          <section class="scenic" aria-labelledby="scenic-title">
            <h3 id="scenic-title">地貌观察点</h3>
            <ul id="region-visits" class="scenic-list"></ul>
          </section>
        </article>
      </div>
    </section>

    <aside class="atlas-note">
      <h2>关于这座岛</h2>
      <p>这是一座综合展览岛，动物来自不同地质年代和地区。图上的菱形标出动物展位的大致位置，年代标注对应动物的化石记录。森林、湿地、湖泊和海岸的布置参考各类生境。</p>
      <p>三维场景中可步行、飞行和游泳。下潜入口会直接从水下开始。</p>
    </aside>
  </main>

  <footer class="site-footer shell">
    <p>史前动物博物馆</p>
    <p>三维漫游需要支持 WebGPU 的桌面浏览器</p>
  </footer>
  <script type="module" src="./main.js"></script>
</body>
</html>
